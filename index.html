<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha interactiva de Lengua</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f3f7;color:#25233b;font:17px system-ui}main{max-width:900px;margin:auto;background:white;padding:clamp(12px,4vw,36px)}h1{color:#b32260;margin-bottom:0}h2{font-size:21px;background:#eee4f6;padding:12px;border-radius:8px;color:#573675}section{margin:28px 0} .item{padding:12px 0;border-bottom:1px solid #e5e5eb;display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,1fr);gap:8px;align-items:center}label{font-weight:600}select,input,button{font:inherit;padding:10px;border:1px solid #8d91a4;border-radius:6px;background:white;color:inherit;width:100%}button{cursor:pointer;background:#593878;color:white;border:0;font-weight:bold}button.secondary{background:#eae5f0;color:#36234e} .good{background:#e5f6e9;border:2px solid #258044}.bad{background:#fff0ef;border:2px solid #b33b38}.feedback{grid-column:1/-1;font-size:15px}.hint{background:#fff5d8;padding:12px;border-radius:6px}summary{cursor:pointer;font-weight:600}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button{flex:1;min-width:150px}#result{font-weight:bold;padding:12px;background:#eef1f8}small{display:block;font-weight:400;color:#555} @media(max-width:540px){.item{grid-template-columns:1fr}} @media print{body{background:white}section{break-inside:avoid}.actions{display:none}}</style><main><h1>FICHA INTERACTIVA DE REPASO</h1><p>Lengua castellana y literatura · Repaso del examen</p><p>1. Lee y completa los ejercicios. 2. Pulsa «Corregir ficha». 3. Revisa tus errores y vuelve a corregir.</p><p>Puedes hacer los ejercicios en cualquier orden.</p><div id="sheet"></div><div class="actions"><button id="check">Corregir ficha</button><button class="secondary" id="reset">Empezar de nuevo</button></div><p id="result" role="status" aria-live="polite">Todavía no has corregido la ficha.</p></main><script>const q=[];function add(t,i,p,o,a,h){q.push({t,i,p,o,a,h})}function choice(t,i,p,o,a,h){add(t,i,p,o,a,h)}
const noun='1. Los sustantivos';for(const [w,tests] of [['Tenerife',[[0,1]]],['Alegría',[[0,0],[1,1]]],['Cuaderno',[[0,0],[1,0],[2,0],[3,0]]],['Rebaño',[[0,0],[1,0],[2,0],[3,1]]],['Leche',[[0,0],[1,0],[2,1]]]]){const types=[['Común','Propio'],['Concreto','Abstracto'],['Contable','Incontable'],['Individual','Colectivo']];const hints=['Común: cualquier lugar, persona o cosa. Propio: nombre particular.','Concreto: se percibe con los sentidos. Abstracto: idea o sentimiento.','Contable: podemos contar unidades. Incontable: se mide o se expresa en cantidades.','Individual: nombra un solo ser u objeto. Colectivo: nombra un conjunto en singular.'];for(const [k,a] of tests)choice(noun,'Elige la clasificación correcta.',w,types[k],a,hints[k])}
for(const [w,a] of [['Profesor / profesora',0],['Padre / madre',1],['El cantante / la cantante',2],['Gato / gata',0],['Yerno / nuera',1]])choice('2. Género','¿Cómo cambia el género?',w,['Cambio de terminación','Heterónimo','Género común (artículo)'],a,'Cambio: amigo/amiga. Heterónimo: caballo/yegua. Género común: el artista/la artista.');
for(const [w,s,a] of [['camion','ca-mión',0],['azucar','a-zú-car',1],['musica','mú-si-ca',2],['reloj','re-loj',0],['ventana','ven-ta-na',1],['brujula','brú-ju-la',2]]){add('3. Sílabas y acentuación','Escribe la palabra separada con guiones. Pon la tilde si hace falta.',w,null,s,'Ejemplo: papel → pa-pel. Las agudas llevan tilde si terminan en vocal, n o s; las llanas, si no terminan en vocal, n o s; las esdrújulas siempre.');choice('3. Sílabas y acentuación','Elige el tipo de palabra.',w,['Aguda','Llana','Esdrújula'],a,'Aguda: última sílaba. Llana: penúltima. Esdrújula: antepenúltima.')}
for(const [w,a] of [['fuerte',0],['pequeño',1],['feliz',0],['lento',1]])choice('5. Adjetivos','¿Una o dos terminaciones?',w,['Una terminación','Dos terminaciones'],a,'Una: amable (masculino y femenino). Dos: alto/alta.');
function words(t,p,a,h){choice(t,'Pulsa la palabra correcta.',p,p.replace(/[.,¡!¿?]/g,'').split(' '),a,h)}
for(const [p,a] of [['El balón amarillo rodó.',2],['Compré una mochila ligera.',3],['La pista estaba mojada.',3],['Vimos un partido emocionante.',3]])words('6. Adjetivos calificativos',p,a,'El adjetivo dice cómo es algo: camiseta azul.');
for(const [p,a,owner] of [['Mis zapatillas están limpias.',0,0],['Encontré tu cuaderno.',1,1],['Nuestra cancha está abierta.',0,2],['Sus entradas están aquí.',0,3]]){words('7. Posesivos',p,a,'Los posesivos indican de quién es algo: mi, tu, su, nuestro…');choice('7. Posesivos','¿De quién es o de quiénes son?',p,['Yo','Tú','Nosotros/as','Él, ella, usted, ustedes o ellos/as'],owner,'Mi/mis → yo. Tu/tus → tú. Nuestro/a → nosotros/as. Su/sus → varios poseedores posibles.')}
for(const [p,a] of [['Esta camiseta es blanca.',0],['Compré esos zapatos.',1],['Aquella montaña es alta.',0],['Mira estas fotos.',1]])words('9. Demostrativos',p,a,'Cerca: este, esta, estos, estas. Distancia media: ese, esa, esos, esas. Lejos: aquel, aquella, aquellos, aquellas.');
for(const [p,a] of [['Lucía juega al fútbol. → ___ juega al fútbol.',1],['Pablo y yo entrenamos. → ___ entrenamos.',2],['Los jugadores descansan. → ___ descansan.',3],['Mario lee un libro. → ___ lee un libro.',0],['Tú y Ana estudian. → ___ estudian.',4]])choice('10. Pronombres personales','Sustituye el sujeto por un pronombre.',p,['Él','Ella','Nosotros','Ellos','Ustedes'],a,'Él/ella: una persona. Nosotros/as: un grupo que me incluye. Ustedes: personas a quienes hablo. Ellos/as: otras personas.');

const sheet=document.getElementById('sheet');let section, last='';const controls=[];const seen=new Set();q.forEach((x,i)=>{if(x.t!==last){section=document.createElement('section');let h=document.createElement('h2');h.textContent=x.t;section.append(h);sheet.append(section);last=x.t;seen.clear()}if(!seen.has(x.h)){seen.add(x.h);let d=document.createElement('details');d.className='hint';let s=document.createElement('summary');s.textContent='Recuerda';let p=document.createElement('p');p.textContent=x.h;d.append(s,p);section.append(d)}let row=document.createElement('div');row.className='item';let label=document.createElement('label');label.htmlFor='a'+i;label.textContent=x.p;let small=document.createElement('small');small.textContent=x.i;label.append(small);let c=document.createElement(x.o?'select':'input');c.id='a'+i;if(x.o){c.add(new Option('Elige una respuesta',''));x.o.forEach((v,j)=>c.add(new Option(v,String(j))))}else{c.placeholder='Escribe con guiones';c.autocomplete='off';c.spellcheck=false}let f=document.createElement('div');f.className='feedback';f.id='f'+i;c.setAttribute('aria-describedby',f.id);row.append(label,c,f);section.append(row);controls.push({c,f,x});c.addEventListener('input',()=>{c.className='';f.textContent='';document.getElementById('result').textContent='Hay cambios sin corregir.'})});document.getElementById('check').onclick=()=>{let ok=0,blank=0;for(const {c,f,x} of controls){let v=c.value.trim();let correct=x.o?v===String(x.a):v.toLowerCase().replace(/\s/g,'').normalize('NFC')===x.a;if(!v){blank++;c.className='';f.textContent='Pendiente de responder.'}else if(correct){ok++;c.className='good';f.textContent='✓ Correcto.'}else{c.className='bad';f.textContent='✗ Revisa: '+x.h}}document.getElementById('result').textContent=`Aciertos: ${ok} de ${q.length}. Errores: ${q.length-ok-blank}. Pendientes: ${blank}. `+(ok===q.length?'¡Ficha completada!':'Revisa las respuestas y vuelve a pulsar Corregir ficha.');};document.getElementById('reset').onclick=()=>{if(confirm('¿Quieres borrar todas tus respuestas?')){for(const {c,f} of controls){c.value='';c.className='';f.textContent=''}document.getElementById('result').textContent='Ficha reiniciada.';window.scrollTo(0,0)}};</script></html>
